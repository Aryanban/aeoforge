[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aeoforge"
version = "0.1.0"
description = "Autonomous Meta AI Agent for Web Agent-Readiness, AEO Auditing, Visual Grounding, and Self-Healing Navigation Specs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Aryan Bansal", email = "aryan24120@iiitd.ac.in" }
]
keywords = [
    "meta-ai",
    "llama-3.2-vision",
    "llama-stack",
    "aeo",
    "answer-engine-optimization",
    "agentic-web",
    "web-agents",
    "mcp",
    "playwright",
    "model-context-protocol"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "playwright>=1.42.0",
    "beautifulsoup4>=4.12.3",
    "httpx>=0.27.0",
    "rich>=13.7.1",
    "python-dotenv>=1.0.1",
    "jinja2>=3.1.3"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "black>=24.2.0",
    "ruff>=0.3.0"
]

[project.scripts]
aeoforge = "aeoforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["aeoforge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
